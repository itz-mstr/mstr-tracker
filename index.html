<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mstr GD Tracker</title>
  <link id="pageFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='2' y='2' width='60' height='60' rx='10' fill='%23ffffff' stroke='%23000000' stroke-width='5'/><rect x='5' y='5' width='54' height='54' rx='7' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%23000000'>mstr.</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000;
      --bg-panel: #080808;
      --bg-panel-border: #262626;
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.16);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --card-radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 60px;
      overflow-x: hidden;
    }

    /* Écran de chargement d'introduction */
    #introLoader {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      overflow: hidden;
    }

    .intro-cube-wrapper {
      animation: loaderGlow 1.6s infinite ease-in-out;
      border-radius: 12px;
      opacity: 1 !important;
    }

    @keyframes loaderGlow {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.55));
      }
      50% {
        filter: drop-shadow(0 0 38px rgba(255, 255, 255, 0.95));
      }
    }

    #animatedCube {
      width: 82px;
      height: 82px;
      background: #ffffff;
      border: 5px solid #000000;
      outline: 3px solid #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      user-select: none;
      overflow: hidden;
      transform-origin: center center;
      will-change: transform;
      opacity: 1 !important;
    }

    #animatedCube img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loader-info {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.25s ease;
    }

    .loader-text {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9ca3af;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .loader-bar-track {
      width: 180px;
      height: 3px;
      background: #18181b;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      width: 100%;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff;
      animation: loaderProgress 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loaderProgress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(100%); }
    }

    /* Conteneur principal */
    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .container.revealed .fade-section {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* En-tête */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Le cube d'en-tête n'a aucune transition d'opacité pour prendre le relais à 100% instantanément */
    .mstr-cube {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 3.5px solid #000000;
      outline: 2px solid #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.65);
      user-select: none;
      flex-shrink: 0;
      overflow: hidden;
      opacity: 0;
    }

    .mstr-cube img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-pill {
      display: none;
      background: #dc2626;
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.8);
    }

    body.admin-mode .admin-pill {
      display: inline-block;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .aredl-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0a0a0a;
      border: 1px solid #27272a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e4e4e7;
      text-transform: uppercase;
      user-select: none;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 8px #eab308;
    }

    /* Boutons Admin dans l'en-tête */
    .admin-controls {
      display: none;
      align-items: center;
      gap: 10px;
    }

    body.admin-mode .admin-controls {
      display: flex;
    }

    .admin-add-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
    }

    .btn {
      background: #0a0a0a;
      color: #fff;
      border: 1px solid #2e2e2e;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background: #171717;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
      font-weight: 800;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
    }

    .btn-primary:hover {
      background: #e5e5e5;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.85);
    }

    .btn-import-mod {
      display: none;
      background: #22c55e;
      border-color: #4ade80;
      color: #000000;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 6px 12px;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.7);
      animation: pulseImport 1.4s infinite ease-in-out;
    }

    .btn-import-mod.visible {
      display: inline-flex;
    }

    @keyframes pulseImport {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); box-shadow: 0 0 22px rgba(34, 197, 94, 1); }
    }

    .btn-settings {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 8px;
    }

    .btn-settings svg {
      width: 20px;
      height: 20px;
      fill: #d4d4d8;
      transition: transform 0.3s ease, fill 0.2s ease;
    }

    .btn-settings:hover svg {
      transform: rotate(45deg);
      fill: #ffffff;
    }

    /* Statistiques rapides (3 cartes : Completed, Current Hardest, Currently Doing) */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.03);
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.32rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .neon-text {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
    }

    /* Onglets */
    .tabs-nav {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #222222;
      margin-bottom: 18px;
      user-select: none;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 14px 12px;
      cursor: pointer;
      position: relative;
      transition: color 0.2s, text-shadow 0.2s;
      text-transform: uppercase;
    }

    .tab-btn:hover {
      color: #d1d5db;
    }

    .tab-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.65);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 10%;
      width: 80%;
      height: 3px;
      background: #ffffff;
      box-shadow: 0 -2px 12px #ffffff, 0 0 8px #ffffff;
      border-radius: 3px 3px 0 0;
    }

    /* Navigation interne de l'onglet OTHER (2 Carrés redimensionnés) */
    .other-hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 340px));
      justify-content: center;
      gap: 18px;
      margin: 22px 0;
      animation: cardStaggerEntrance 0.35s ease both;
    }

    .other-square-card {
      background: linear-gradient(145deg, #0b0b0b 0%, #030303 100%);
      border: 1.5px solid #27272a;
      border-radius: 12px;
      padding: 26px 22px;
      text-align: center;
      cursor: pointer;
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 155px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.85);
    }

    .other-square-card:hover {
      transform: translateY(-3px);
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.22);
    }

    .other-square-card h2 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .other-square-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      line-height: 1.35;
    }

    .other-square-card .square-count {
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    .other-Breadcrumb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #080808;
      border: 1px solid #262626;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .breadcrumb-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-arrow-btn {
      background: #121212;
      border: 1px solid #3f3f46;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .back-arrow-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .current-square-indicator {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .current-square-indicator span {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    /* Roue de la fortune (Admin Only dans Wanted) */
    .wheel-panel {
      background: #070707;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.08);
    }

    .wheel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1f1f23;
      padding-bottom: 12px;
    }

    .wheel-header h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    .wheel-layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 24px;
      align-items: center;
    }

    .wheel-canvas-wrap {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-pointer {
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 22px solid #ffffff;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
      z-index: 5;
    }

    .wheel-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .wheel-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .wheel-modes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .wheel-checklist {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      max-height: 155px;
      overflow-y: auto;
      background: #000000;
      border: 1px solid #222;
      padding: 10px;
      border-radius: 8px;
    }

    .wheel-check-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      color: #e4e4e7;
      cursor: pointer;
      user-select: none;
    }

    .wheel-result-banner {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      min-height: 26px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    }

    /* Barre de recherche et filtres */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: #080808;
      border: 1px solid #262626;
      color: #9ca3af;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      border-color: #52525b;
      color: #f4f4f5;
    }

    .chip-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .category-select {
      background: #080808;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .category-select option {
      background: #080808;
      color: #ffffff;
    }

    .wanted-cat-header {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      margin: 14px 0 6px;
      padding-left: 8px;
      border-left: 3px solid #ffffff;
    }

    @keyframes cardStaggerEntrance {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .demon-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .demon-card-wrapper {
      display: flex;
      flex-direction: column;
      animation: cardStaggerEntrance 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--delay, 0) * 0.028s);
    }

    .demon-card {
      position: relative;
      min-height: 104px;
      border-radius: var(--card-radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      background-size: cover;
      background-position: center 38%;
      background-repeat: no-repeat;
      gap: 16px;
    }

    .demon-card.clickable-card {
      cursor: pointer;
    }

    .demon-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .demon-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(8, 8, 8, 0.82) 48%,
        rgba(12, 12, 12, 0.58) 100%
      );
      z-index: 1;
    }

    .card-left {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
      min-width: 0;
    }

    .rank-block {
      min-width: 84px;
      text-align: left;
    }

    .rank-number {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      line-height: 1.1;
    }

    .rank-sub {
      font-size: 0.74rem;
      color: #d4d4d8;
      font-weight: 700;
    }

    .level-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .level-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .level-name {
      font-size: 1.32rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-hardest {
      background: #ffffff;
      color: #000000;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    /* Badge Dream Hardest en rouge lumineux */
    .badge-dream {
      background: #dc2626;
      color: #ffffff;
      border: 1px solid #f87171;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.85);
    }

    .badge-enjoyment {
      font-size: 0.73rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .level-meta {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e4e4e7;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .level-notes {
      font-size: 0.8rem;
      color: #a1a1aa;
      font-style: italic;
      margin-top: 2px;
    }

    /* Badges de statut Wanted -> Progress */
    .badge-no-progress {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(127, 29, 29, 0.45);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-has-progress {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(20, 83, 45, 0.65);
      border: 1px solid #22c55e;
      color: #86efac;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.35);
      transition: all 0.15s ease;
    }

    .badge-has-progress:hover {
      background: #22c55e;
      color: #000000;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.85);
    }

    .card-right {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .stat-boxes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 165px;
    }

    .stat-box {
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
    }

    .progress-pill-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid #ffffff;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 1px;
      padding: 10px 16px;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Menu déroulant pour les cartes Progress */
    .progress-drawer {
      display: none;
      background: #070707;
      border: 1px solid #2e2e2e;
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 16px 20px;
      margin-top: -4px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.8);
    }

    .progress-drawer.open {
      display: grid;
    }

    .drawer-stat {
      background: #0d0d0d;
      border: 1px solid #222;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .drawer-stat .d-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .drawer-stat .d-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
    }

    @keyframes flashLastClick {
      0%, 100% {
        background: #000000;
        border-color: #7f1d1d;
        box-shadow: 0 0 6px rgba(153, 27, 27, 0.5);
      }
      50% {
        background: #630606;
        border-color: #ef4444;
        box-shadow: 0 0 16px rgba(220, 38, 38, 0.9), inset 0 0 8px rgba(220, 38, 38, 0.45);
      }
    }

    .stat-box.last-click-flash {
      animation: flashLastClick 1.15s infinite ease-in-out !important;
    }

    .stat-box .box-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .stat-box .box-val {
      font-size: 0.84rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yt-btn {
      width: 44px;
      height: 60px;
      background: #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      border: none;
      cursor: pointer;
    }

    .yt-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
    }

    .yt-btn svg {
      width: 20px;
      height: 20px;
      fill: #000000;
    }

    /* Boutons d'édition sur les cartes (visibles uniquement en mode Admin) */
    .action-stack {
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    body.admin-mode .action-stack {
      display: flex;
    }

    .icon-btn {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #d4d4d8;
      width: 32px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      transition: transform 0.25s ease;
    }

    .icon-btn.edit-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    }

    .icon-btn.edit-btn:hover svg {
      transform: rotate(45deg);
    }

    .icon-btn.delete-btn:hover {
      background: rgba(239, 68, 68, 0.95);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    /* Fenêtres Modales (Admin) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #060606;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      width: 100%;
      max-width: 580px;
      padding: 24px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.12);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid #222;
      padding-bottom: 12px;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.45);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: #000000;
      border: 1px solid #27272a;
      color: #fff;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
    }

    .settings-section-title {
      grid-column: 1 / -1;
      font-size: 0.9rem;
      font-weight: 800;
      color: #f4f4f5;
      margin-top: 8px;
    }

    .gradient-preview {
      grid-column: 1 / -1;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, hsl(135, 75%, 38%), hsl(60, 80%, 40%), hsl(0, 80%, 42%));
      margin-bottom: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
      border-top: 1px solid #222;
      padding-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0a0a0a;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
      z-index: 2000;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 720px) {
      .wheel-layout {
        grid-template-columns: 1fr;
      }
      .demon-card {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
      }
      .card-right {
        justify-content: space-between;
        width: 100%;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 10px;
      }
      .stat-boxes {
        flex-direction: row;
        width: auto;
        flex: 1;
      }
      .stat-box {
        flex: 1;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Écran de chargement avec le Cube animé (opacité constante à 1) -->
  <div id="introLoader">
    <div class="intro-cube-wrapper" id="cubeGlowWrapper">
      <div id="animatedCube" title="mstr.">mstr.</div>
    </div>
    <div class="loader-info" id="loaderInfo">
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
      <div class="loader-text" id="loaderText">CONNECTING TO AREDL API...</div>
    </div>
  </div>

  <!-- Conteneur principal -->
  <div class="container" id="mainContainer">
    <div class="header-bar">
      <div class="brand">
        <div class="mstr-cube" id="headerCube" title="mstr.">mstr.</div>
        <h1 class="fade-section">
          MSTR GD TRACKER
          <span class="admin-pill">ADMIN MODE</span>
        </h1>
      </div>

      <div class="header-right fade-section">
        <div class="aredl-badge" id="aredlStatus">
          <span class="status-dot" id="statusDot"></span>
          <span id="aredlStatusText">CONNECTING...</span>
        </div>

        <!-- Contrôles exclusifs au Mode Admin (admin=1) -->
        <div class="admin-controls">
          <button class="btn btn-settings" onclick="openSettingsModal()" title="Tracker Settings">
            <svg viewBox="0 0 24 24">

            </svg>
          </button>
          <div class="admin-add-stack">
            <button class="btn btn-import-mod" id="importModBtn" onclick="downloadUpdatedDataJS()">
              📥 Import Modification
            </button>
            <button class="btn btn-primary" onclick="openModal()">+ Add Extreme</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Statistiques en haut (Completed, Current Hardest, Currently Doing) -->
    <div class="stats-strip fade-section" id="statsStrip"></div>

    <!-- Onglets principaux -->
    <div class="tabs-nav fade-section">
      <button class="tab-btn active" id="tab-completed" onclick="switchTab('completed')">
        COMPLETED (<span id="count-completed">0</span>)
      </button>
      <button class="tab-btn" id="tab-hardest" onclick="switchTab('hardest')">
        HARDEST RANKING (<span id="count-hardest">0</span>)
      </button>
      <button class="tab-btn" id="tab-other" onclick="switchTab('other')">
        OTHER (<span id="count-other">0</span>)
      </button>
    </div>

    <!-- Zone dynamique pour l'onglet OTHER -->
    <div id="otherSectionContainer" class="fade-section"></div>

    <!-- Barre de recherche et filtres secondaires -->
    <div class="toolbar fade-section" id="mainToolbar">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search an Extreme Demon, publisher, notes, date..."
        oninput="renderList()"
      />
      <div class="filter-group" id="subFilters"></div>
    </div>

    <!-- Liste des niveaux -->
    <div class="demon-list fade-section" id="demonList"></div>
  </div>

  <!-- Fenêtre Modale Admin : Ajouter / Modifier un Extreme -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add an Extreme Demon</h2>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
      <form id="demonForm" onsubmit="saveDemon(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Category</label>
            <select id="f_category" onchange="toggleFormFields()">
              <option value="completed">Completed</option>
              <option value="wanted">Wanted (Other)</option>
              <option value="progress">Progress (Other)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Level Name * (Tip: add * at the end for Dream Hardest)</label>
            <input type="text" id="f_level" required placeholder="Ex: Limbo* or Trueffet" />
          </div>
          <div class="form-group">
            <label>AREDL Rank (Top) *</label>
            <input type="number" id="f_top" required placeholder="Ex: 160" />
          </div>
          <div class="form-group">
            <label>Publisher (Auto-filled via AREDL if empty)</label>
            <input type="text" id="f_publisher" placeholder="Ex: MindCap" />
          </div>

          <!-- Champs Completed -->
          <div class="form-group" id="g_order">
            <label>Extreme Order (#)</label>
            <input type="number" id="f_order" placeholder="Ex: 22" />
          </div>
          <div class="form-group" id="g_date">
            <label>Completion Date</label>
            <input type="text" id="f_date" placeholder="DD/MM/YYYY" />
          </div>
          <div class="form-group" id="g_enjoyment">
            <label>Enjoyment (/100)</label>
            <input type="number" id="f_enjoyment" min="0" max="100" placeholder="Ex: 85" />
          </div>
          <div class="form-group" id="g_worstFail">
            <label>Worst Fail (write 90%* for last click)</label>
            <input type="text" id="f_worstFail" placeholder="Ex: 89%* or 84%" />
          </div>
          <div class="form-group" id="g_attempts">
            <label>Attempts</label>
            <input type="text" id="f_attempts" placeholder="Ex: 12435" />
          </div>
          <div class="form-group" id="g_hardest">
            <label>New Hardest?</label>
            <select id="f_hardest">
              <option value="Non">No</option>
              <option value="Oui">Yes (New Hardest)</option>
            </select>
          </div>

          <!-- Champs exclusifs à Progress -->
          <div class="form-group" id="g_bestFromZero" style="display:none;">
            <label>Best from 0% (ex: 64%)</label>
            <input type="text" id="f_bestFromZero" placeholder="Ex: 64%" />
          </div>
          <div class="form-group" id="g_bestRun" style="display:none;">
            <label>Best Run (ex: 42-100%)</label>
            <input type="text" id="f_bestRun" placeholder="Ex: 42-100%" />
          </div>
          <div class="form-group" id="g_runsCount" style="display:none;">
            <label>Level in (X runs)</label>
            <input type="text" id="f_runsCount" placeholder="Ex: 3 runs" />
          </div>

          <div class="form-group full" id="g_yt">
            <label>YouTube Video URL (optional)</label>
            <input type="url" id="f_yt" placeholder="https://www.youtube.com/watch?v=..." />
          </div>
          <div class="form-group full" id="g_banner">
            <label>Custom Banner Image URL (optional)</label>
            <input type="url" id="f_banner" placeholder="https://... (Leave empty for YouTube HD thumbnail)" />
          </div>
          <div class="form-group full" id="g_notes">
            <label>Notes / Comment</label>
            <textarea id="f_notes" rows="2" placeholder="Thoughts on the level, flukes, etc."></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Save Extreme</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fenêtre Modale Admin : Réglages -->
  <div class="modal-backdrop" id="settingsBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ Tracker Settings</h2>
        <button class="btn" onclick="closeSettingsModal()">✕</button>
      </div>
      <form onsubmit="saveSettings(event)">
        <div class="form-grid">
          <div class="settings-section-title">Cube Icon (Header & Browser Tab)</div>
          <div class="form-group full">
            <label>Custom Cube Image URL (Leave blank for mstr. cube)</label>
            <input type="url" id="s_cubeIcon" placeholder="Ex: https://.../cube.png" />
          </div>

          <div class="settings-section-title">Color Gradient: Attempts</div>
          <div class="gradient-preview"></div>
          <div class="form-group">
            <label>Green Threshold (Low attempts)</label>
            <input type="number" id="s_attGreen" required min="0" />
          </div>
          <div class="form-group">
            <label>Red Threshold (High attempts)</label>
            <input type="number" id="s_attRed" required min="1" />
          </div>

          <div class="settings-section-title">Color Gradient: Worst Fail (%)</div>
          <div class="gradient-preview"></div>
          <div class="form-group">
            <label>Green Threshold (Low %)</label>
            <input type="number" id="s_wfGreen" required min="0" max="100" />
          </div>
          <div class="form-group">
            <label>Red Threshold (High %)</label>
            <input type="number" id="s_wfRed" required min="1" max="100" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeSettingsModal()">Close</button>
          <button type="submit" class="btn btn-primary">Apply Settings</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

    // Récupère à la fois la position (Top) et le Publisher depuis l'API v2 de l'AREDL
    async function fetchAredlData(timeoutMs = 2200) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch("https://api.aredl.net/v2/api/aredl/levels", {
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        clearTimeout(timer);

        if (!res.ok) throw new Error("HTTP status " + res.status);
        const levels = await res.json();
        const levelMap = new Map();

        levels.forEach(lvl => {
          if (lvl.name && lvl.position) {
            const cleanKey = lvl.name.toLowerCase().trim();
            if (!levelMap.has(cleanKey)) {
              let pubName = "";
              if (lvl.publisher) {
                if (typeof lvl.publisher === "string") {
                  pubName = lvl.publisher;
                } else {
                  pubName = lvl.publisher.global_name || lvl.publisher.username || lvl.publisher.name || "";
                }
              }
              levelMap.set(cleanKey, {
                position: lvl.position,
                publisher: pubName
              });
            }
          }
        });

        let updatedCount = 0;
        ["completed", "wanted", "progress"].forEach(listKey => {
          if (DATA[listKey]) {
            DATA[listKey].forEach(item => {
              const key = cleanLevelName(item.level).toLowerCase();
              if (levelMap.has(key)) {
                const info = levelMap.get(key);
                if (item.top !== info.position) {
                  item.top = info.position;
                  updatedCount++;
                }
                if (info.publisher) {
                  item.publisher = info.publisher;
                }
              }
            });
          }
        });
        return { success: true, count: updatedCount };
      } catch (err) {
        clearTimeout(timer);
        return { success: false };
      }
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function getBannerStyle(item) {
      if (item.banner && item.banner.trim() !== "") {
        return `background-image: url('${item.banner}')`;
      }
      const videoId = extractYouTubeId(item.yt);
      if (videoId) {
        return `background-image: url('https://img.youtube.com/vi/${videoId}/maxresdefault.jpg'), url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg')`;
      }
      const clean = cleanLevelName(item.level);
      const hash = clean.split("").reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const gradient = BANNER_PALETTES[hash % BANNER_PALETTES.length];
      return `background-image: ${gradient}`;
    }

    function parseAttempts(att) {
      if (!att) return 0;
      const str = String(att).replace(/,/g, "").trim();
      if (str.includes("-")) {
        const parts = str.split("-").map(Number);
        return Math.round((parts[0] + parts[1]) / 2);
      }
      return parseInt(str, 10) || 0;
    }

    function formatWorstFail(wf) {
      if (!wf) return "-";
      let str = String(wf).trim();
      if (str.includes("*")) {
        str = str.replace(/\*/g, "").trim();
        if (!str.toLowerCase().includes("last click")) {
          str += " (last click)";
        }
      }
      return str;
    }

    function isLastClickFail(wf) {
      if (!wf) return false;
      const str = String(wf).toLowerCase();
      return str.includes("*") || str.includes("last click");
    }

    function parseWorstFail(wf) {
      if (!wf) return 0;
      const match = String(wf).match(/(\d+(?:\.\d+)?)/);
      return match ? parseFloat(match[1]) : 0;
    }

    function getThresholdColor(value, greenVal, redVal) {
      let ratio = 0;
      if (redVal !== greenVal) {
        ratio = (value - greenVal) / (redVal - greenVal);
      }
      ratio = Math.max(0, Math.min(1, ratio));
      const hue = Math.round((1 - ratio) * 135);
      return `background: linear-gradient(135deg, hsla(${hue}, 80%, 32%, 0.92), hsla(${hue}, 85%, 22%, 0.95)); border-color: hsla(${hue}, 85%, 52%, 0.65);`;
    }

    function getEnjoymentStyle(enjoyment) {
      const val = Math.max(0, Math.min(100, Number(enjoyment) || 0));
      const hue = Math.round((val / 100) * 135);
      return `background: hsla(${hue}, 82%, 36%, 0.95); border: 1px solid hsla(${hue}, 90%, 55%, 0.8);`;
    }

          const timeB = b.item.updatedAt || (b.idx + 1);
          return timeB - timeA;
        })
        .map(entry => entry.item);
    }

    function drawWheelCanvas() {
      const canvas = document.getElementById("wheelCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const items = Array.from(wheelSelectedLevels);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = cx - 8;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (items.length === 0) {
        ctx.fillStyle = "#18181b";
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#9ca3af";
        ctx.font = "bold 13px Outfit";
        ctx.textAlign = "center";
        ctx.fillText("Select at least 1 level", cx, cy);
        return;
      }

      const sliceAngle = (Math.PI * 2) / items.length;
      const colors = ["#09090b", "#18181b", "#27272a", "#111827", "#1f2937"];

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(wheelRotation);

      items.forEach((rawLabel, i) => {
        const label = cleanLevelName(rawLabel);
        const start = i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(255,255,255,0.45)";
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11.5px Outfit";
        const shortLabel = label.length > 15 ? label.slice(0, 14) + "…" : label;
        ctx.fillText(shortLabel, r - 14, 4);
        ctx.restore();
      });

      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#000000";
      ctx.stroke();
    }

    function spinWheel() {
      if (isSpinning) return;
      const items = Array.from(wheelSelectedLevels);
      const resEl = document.getElementById("wheelResultText");
      if (items.length === 0) {
        if (resEl) resEl.textContent = "Select at least one level!";
        return;
      }
      if (items.length === 1) {
        if (resEl) resEl.textContent = `Winner: ${cleanLevelName(items[0])}!`;
        return;
      }

      isSpinning = true;
      if (resEl) resEl.textContent = "Spinning...";

      const extraSpins = (5 + Math.random() * 4) * Math.PI * 2;
      const startRot = wheelRotation;
      const targetRot = startRot + extraSpins;
      const duration = 3200;
      const startTime = performance.now();

      function animateWheel(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const easeOut = 1 - Math.pow(1 - t, 4);
        wheelRotation = startRot + (targetRot - startRot) * easeOut;
        drawWheelCanvas();

        if (t < 1) {
          requestAnimationFrame(animateWheel);
        } else {
          isSpinning = false;
          const sliceAngle = (Math.PI * 2) / items.length;
          const normalized = ((Math.PI * 2) - (wheelRotation % (Math.PI * 2))) % (Math.PI * 2);
          const winningIndex = Math.floor(normalized / sliceAngle) % items.length;
          const chosen = items[winningIndex];
          const chosenClean = cleanLevelName(chosen);

          if (wheelMode === "selection") {
            if (resEl) resEl.textContent = `Selected Extreme: ${chosenClean}!`;
          } else {
            wheelSelectedLevels.delete(chosen);
            const remaining = Array.from(wheelSelectedLevels);
            if (remaining.length === 1) {
              if (resEl) resEl.textContent = `${chosenClean} eliminated! LAST SURVIVOR: ${cleanLevelName(remaining[0])}!`;
            } else {
              if (resEl) resEl.textContent = `Eliminated: ${chosenClean} (${remaining.length} left)`;
            }
            setTimeout(() => renderOtherSection(), 750);
          }
        }
      }

      requestAnimationFrame(animateWheel);
    }

      const t = Number(top) || 9999;
      if (t >= 1 && t <= 150) return "1-150";
      if (t > 150 && t <= 400) return "150-400";
      if (t > 400 && t <= 800) return "400-800";
      if (t > 800 && t <= 1200) return "800-1200";
      return "1200+";
    }

      const key = cleanLevelName(levelName).toLowerCase();
      return (DATA.progress || []).some(p => cleanLevelName(p.level).toLowerCase() === key);

    function renderList() {
      const listEl = document.getElementById("demonList");
      if (!listEl) return;

      if (currentTab === "other" && otherSubView === "menu") {
        listEl.innerHTML = "";
        return;
      }

      const searchEl = document.getElementById("searchInput");
      const query = searchEl ? searchEl.value.toLowerCase().trim() : "";
      let items = [];

      const comp = DATA.completed || [];
      const wanted = DATA.wanted || [];

      if (currentTab === "completed") {
        items = [...comp];
        if (completedSort === "recent") items.sort((a, b) => b.order - a.order);
        if (completedSort === "chrono") items.sort((a, b) => a.order - b.order);
        if (completedSort === "enjoyment") items.sort((a, b) => (b.enjoyment || 0) - (a.enjoyment || 0));
      } else if (currentTab === "hardest") {
        items = [...comp];
        if (hardestFilterOnly) {
          items = items.filter(d => String(d.hardest).toLowerCase() === "oui");
        }
        items.sort((a, b) => (a.top || 9999) - (b.top || 9999));
        items.forEach((item, index) => {
          item.hardestRank = index + 1;
        });
      } else if (currentTab === "other" && otherSubView === "wanted") {
        items = [...wanted].sort((a, b) => (a.top || 9999) - (b.top || 9999));
        if (wantedCategory !== "all") {
          items = items.filter(d => getWantedCategoryKey(d.top) === wantedCategory);
        }
      } else if (currentTab === "other" && otherSubView === "progress") {
        if (progressSort === "recent") {
          items = getSortedProgressByRecent();
        } else {
          items = [...(DATA.progress || [])].sort((a, b) => (a.top || 9999) - (b.top || 9999));
        }
      }

      if (query) {
        items = items.filter(d =>
          cleanLevelName(d.level).toLowerCase().includes(query) ||
          (d.publisher && d.publisher.toLowerCase().includes(query)) ||
          (d.notes && d.notes.toLowerCase().includes(query)) ||
          (d.date && d.date.toLowerCase().includes(query)) ||
          String(d.top).includes(query)
        );
      }

      if (items.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No Extreme Demons found in this section.</div>`;
        return;
      }

      if (currentTab === "other" && otherSubView === "wanted" && wantedCategory === "all") {
        const categories = [
          { key: "1-150", label: "Top 1 to 150" },
          { key: "150-400", label: "Top 150 to 400" },
          { key: "400-800", label: "Top 400 to 800" },
          { key: "800-1200", label: "Top 800 to 1200" },
          { key: "1200+", label: "Top 1200+" }
        ];
        let html = "";
        categories.forEach(cat => {
          const group = items.filter(d => getWantedCategoryKey(d.top) === cat.key);
          if (group.length > 0) {
            html += `<div class="wanted-cat-header">${cat.label} (${group.length})</div>`;
            html += group.map((item, idx) => renderCardHTML(item, idx)).join("");
          }
        });
        listEl.innerHTML = html;
        return;
      }

      listEl.innerHTML = items.map((item, idx) => renderCardHTML(item, idx)).join("");
    }

      });
      progFields.forEach(id => {

      });
      document.getElementById("g_attempts").style.display = (cat === "completed" || cat === "progress") ? "flex" : "none";

      document.getElementById("modalSubmitBtn").textContent = "Save Extreme";
      document.getElementById("demonForm").reset();

      if (currentTab === "other" && otherSubView === "progress") defaultCat = "progress";

      document.getElementById("f_order").value = (DATA.completed ? DATA.completed.length : 0) + 1;

    function openEditModal(listKey, levelName) {
      const idx = DATA[listKey].findIndex(item => item.level === levelName);
      if (idx === -1) return;
      const item = DATA[listKey][idx];
      editingState = { listKey, index: idx };

      document.getElementById("modalTitle").textContent = `Edit: ${cleanLevelName(item.level)}`;
      document.getElementById("modalSubmitBtn").textContent = "Save Changes";

      document.getElementById("f_category").value = listKey;
      document.getElementById("f_level").value = item.level || "";
      document.getElementById("f_top").value = item.top || "";
      document.getElementById("f_publisher").value = item.publisher || "";
      document.getElementById("f_order").value = item.order ?? (DATA.completed.length + 1);
      document.getElementById("f_date").value = item.date || "";
      document.getElementById("f_enjoyment").value = item.enjoyment ?? "";
      document.getElementById("f_worstFail").value = item.worstFail || "";
      document.getElementById("f_attempts").value = item.attempts || "";
      document.getElementById("f_hardest").value = item.hardest || "Non";
      document.getElementById("f_bestFromZero").value = item.bestFromZero || "";
      document.getElementById("f_bestRun").value = item.bestRun || "";
      document.getElementById("f_runsCount").value = item.runsCount || "";
      document.getElementById("f_yt").value = item.yt || "";

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
      editingState = null;
    }

    function saveDemon(e) {
      e.preventDefault();
      const targetCat = document.getElementById("f_category").value;
      const level = document.getElementById("f_level").value.trim();
      const top = parseInt(document.getElementById("f_top").value, 10) || 9999;
      const publisher = document.getElementById("f_publisher").value.trim();
      const notes = document.getElementById("f_notes").value.trim();
      const yt = document.getElementById("f_yt").value.trim();
      const banner = document.getElementById("f_banner").value.trim();

      let entryData;
      if (targetCat === "completed") {
        entryData = {
          order: parseInt(document.getElementById("f_order").value, 10) || (DATA.completed.length + 1),
          level,
          publisher,
          date: document.getElementById("f_date").value.trim(),
          enjoyment: parseInt(document.getElementById("f_enjoyment").value, 10) || 0,
          worstFail: formatWorstFail(document.getElementById("f_worstFail").value.trim()),
          attempts: document.getElementById("f_attempts").value.trim(),
          hardest: document.getElementById("f_hardest").value,
          top,
          notes,
          yt,
          banner
        };
      } else if (targetCat === "wanted") {
        entryData = {
          order: DATA.wanted.length + 1,
          level,
          publisher,
          top,
          notes,
          yt,
          banner
        };
      } else {
        entryData = {
          level,
          publisher,
          top,
          attempts: document.getElementById("f_attempts").value.trim(),
          bestFromZero: document.getElementById("f_bestFromZero").value.trim(),
          bestRun: document.getElementById("f_bestRun").value.trim(),
          runsCount: document.getElementById("f_runsCount").value.trim(),
          updatedAt: Date.now(), // Enregistre la date de modification/ajout pour le tri "Most Recent" et "Currently Doing"
          notes,
          yt,
          banner
        };
      }

      if (editingState) {
        if (editingState.listKey !== targetCat) {
          DATA[editingState.listKey].splice(editingState.index, 1);
          DATA[targetCat].push(entryData);
        } else {
          DATA[targetCat][editingState.index] = entryData;
        }
      } else {
        DATA[targetCat].push(entryData);
        if (targetCat === "wanted") wheelSelectedLevels.add(level);
      }

      // Synchronise le publisher avec l'API si non renseigné
      fetchAredlData(1800).then(() => {
        updateStats();
        renderList();
      });

      markModified();
      updateStats();
      renderOtherSection();
      renderSubFilters();
      renderList();
      closeModal();
      showToast(`✅ "${cleanLevelName(level)}" saved! Click "Import Modification" to download data.js.`);
    }

    function deleteItem(listKey, levelName) {
      if (confirm(`Delete "${cleanLevelName(levelName)}" from ${listKey}?`)) {
        DATA[listKey] = DATA[listKey].filter(item => item.level !== levelName);
        wheelSelectedLevels.delete(levelName);
        markModified();
        updateStats();
        renderOtherSection();
        renderSubFilters();
        renderList();
        showToast(`🗑 "${cleanLevelName(levelName)}" removed.`);
      }
    }

    // Animation d'introduction : le cube conserve une opacité de 1 en permanence
    function triggerIntroAnimation() {
      if (animationTriggered) return;
      animationTriggered = true;
      clearTimeout(hardFallbackTimer);

      const introLoader = document.getElementById("introLoader");
      const animatedCube = document.getElementById("animatedCube");
      const headerCube = document.getElementById("headerCube");
      const container = document.getElementById("mainContainer");
      const loaderInfo = document.getElementById("loaderInfo");

      if (loaderInfo) loaderInfo.style.opacity = "0";

      if (!animatedCube || !headerCube || !container) {
        if (introLoader) introLoader.remove();
        if (container) container.classList.add("revealed");
        if (headerCube) headerCube.style.opacity = "1";
        return;
      }

      const startRect = animatedCube.getBoundingClientRect();
      const endRect = headerCube.getBoundingClientRect();

      const deltaX = (endRect.left + endRect.width / 2) - (startRect.left + startRect.width / 2);
      const deltaY = (endRect.top + endRect.height / 2) - (startRect.top + startRect.height / 2);
      const scale = endRect.width / (startRect.width || 82);

      if (typeof animatedCube.animate === "function") {
        const flyAnim = animatedCube.animate([
          { transform: "translate(0px, 0px) scale(1)", opacity: 1 },
          { transform: `translate(${deltaX}px, ${deltaY}px) scale(${scale})`, opacity: 1 }
        ], {
          duration: 820,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "forwards"
        });

        flyAnim.onfinish = () => {
          // Relais instantané sans fondu sur le cube : son opacité reste à 100% tout le temps
          headerCube.style.opacity = "1";
          introLoader.style.backgroundColor = "transparent";
          introLoader.style.pointerEvents = "none";
          animatedCube.style.visibility = "hidden";

          // Le reste du tracker apparaît en fondu autour du cube
          container.classList.add("revealed");

          setTimeout(() => {
            if (introLoader) introLoader.remove();
          }, 620);
        };
      } else {
        headerCube.style.opacity = "1";
        container.classList.add("revealed");
        if (introLoader) introLoader.remove();
      }
    }

    async function initApp() {
      applyCubeIcon();

      const minDisplayTimer = new Promise(resolve => setTimeout(resolve, 850));
      const aredlFetchPromise = fetchAredlData(2200);

      try {
        const [_, aredlResult] = await Promise.all([minDisplayTimer, aredlFetchPromise]);
        setAredlBadgeStatus(aredlResult && aredlResult.success);
      } catch (err) {
        setAredlBadgeStatus(false);
      }

      safeRender();
      triggerIntroAnimation();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
