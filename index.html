<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mstr Extreme Demon Tracker</title>
  <link id="pageFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='2' y='2' width='60' height='60' rx='10' fill='%23ffffff' stroke='%23000000' stroke-width='5'/><rect x='5' y='5' width='54' height='54' rx='7' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%23000000'>mstr.</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000;
      --bg-panel: #080808;
      --bg-panel-border: #262626;
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.16);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --card-radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 60px;
      overflow-x: hidden;
    }

    /* Écran de chargement d'introduction */
    #introLoader {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      overflow: hidden;
    }

    .intro-cube-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #animatedCube {
      width: 78px;
      height: 78px;
      background: #ffffff;
      border: 5px solid #000000;
      outline: 3px solid #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.75), 0 0 70px rgba(255, 255, 255, 0.35);
      user-select: none;
      animation: cubePulse 1.8s infinite ease-in-out;
      overflow: hidden;
      will-change: transform, opacity, box-shadow;
    }

    #animatedCube img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes cubePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.65), 0 0 60px rgba(255, 255, 255, 0.25);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 50px rgba(255, 255, 255, 0.95), 0 0 90px rgba(255, 255, 255, 0.5);
      }
    }

    .loader-info {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.35s ease;
    }

    .loader-text {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9ca3af;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .loader-bar-track {
      width: 180px;
      height: 3px;
      background: #18181b;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      width: 100%;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff;
      animation: loaderProgress 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loaderProgress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(100%); }
    }

    /* Conteneur principal (opacité 0 au début) */
    .container {
      max-width: 980px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .brand span.tag {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.6);
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 6px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    /* Section droite de l'en-tête */
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .aredl-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0a0a0a;
      border: 1px solid #27272a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e4e4e7;
      text-transform: uppercase;
      user-select: none;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .mstr-cube {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 3.5px solid #000000;
      outline: 2px solid #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.65);
      user-select: none;
      flex-shrink: 0;
      overflow: hidden;
      opacity: 0; /* Rendu visible après l'atterrissage du cube animé */
    }

    .mstr-cube img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Statistiques */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.03);
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .neon-text {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
    }

    /* Onglets */
    .tabs-nav {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #222222;
      margin-bottom: 18px;
      user-select: none;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 14px 12px;
      cursor: pointer;
      position: relative;
      transition: color 0.2s, text-shadow 0.2s;
      text-transform: uppercase;
    }

    .tab-btn:hover {
      color: #d1d5db;
    }

    .tab-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.65);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 10%;
      width: 80%;
      height: 3px;
      background: #ffffff;
      box-shadow: 0 -2px 12px #ffffff, 0 0 8px #ffffff;
      border-radius: 3px 3px 0 0;
    }

    /* Barre de recherche et filtres */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: #080808;
      border: 1px solid #262626;
      color: #9ca3af;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      border-color: #52525b;
      color: #f4f4f5;
    }

    .chip-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .category-select {
      background: #080808;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .category-select option {
      background: #080808;
      color: #ffffff;
    }

    .wanted-cat-header {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      margin: 14px 0 6px;
      padding-left: 8px;
      border-left: 3px solid #ffffff;
    }

    /* Cartes de démons */
    .demon-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .demon-card {
      position: relative;
      min-height: 104px;
      border-radius: var(--card-radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      background-size: cover;
      background-position: center 38%;
      background-repeat: no-repeat;
      gap: 16px;
    }

    .demon-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .demon-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(8, 8, 8, 0.82) 48%,
        rgba(12, 12, 12, 0.58) 100%
      );
      z-index: 1;
    }

    .card-left {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
      min-width: 0;
    }

    .rank-block {
      min-width: 84px;
      text-align: left;
    }

    .rank-number {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      line-height: 1.1;
    }

    .rank-sub {
      font-size: 0.74rem;
      color: #d4d4d8;
      font-weight: 700;
    }

    .level-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .level-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .level-name {
      font-size: 1.32rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-hardest {
      background: #ffffff;
      color: #000000;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    .badge-enjoyment {
      font-size: 0.73rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .level-meta {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e4e4e7;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .level-notes {
      font-size: 0.8rem;
      color: #a1a1aa;
      font-style: italic;
      margin-top: 2px;
    }

    .card-right {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .stat-boxes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 165px;
    }

    .stat-box {
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
    }

    @keyframes flashLastClick {
      0%, 100% {
        background: #000000;
        border-color: #7f1d1d;
        box-shadow: 0 0 6px rgba(153, 27, 27, 0.5);
      }
      50% {
        background: #630606;
        border-color: #ef4444;
        box-shadow: 0 0 16px rgba(220, 38, 38, 0.9), inset 0 0 8px rgba(220, 38, 38, 0.45);
      }
    }

    .stat-box.last-click-flash {
      animation: flashLastClick 1.15s infinite ease-in-out !important;
    }

    .stat-box .box-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .stat-box .box-val {
      font-size: 0.84rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-btn {
      width: 44px;
      height: 60px;
      background: #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      border: none;
      cursor: pointer;
    }

    .yt-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
    }

    .yt-btn svg {
      width: 20px;
      height: 20px;
      fill: #000000;
    }

    @media (max-width: 720px) {
      .header-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        align-self: flex-end;
      }
      .demon-card {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
      }
      .card-right {
        justify-content: space-between;
        width: 100%;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 10px;
      }
      .stat-boxes {
        flex-direction: row;
        width: auto;
        flex: 1;
      }
      .stat-box {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Écran de chargement d'introduction -->
  <div id="introLoader">
    <div class="intro-cube-container">
      <div id="animatedCube" title="mstr.">mstr.</div>
    </div>
    <div class="loader-info" id="loaderInfo">
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
      <div class="loader-text" id="loaderText">CONNECTING TO AREDL API...</div>
    </div>
  </div>

  <!-- Conteneur principal du tracker -->
  <div class="container" id="mainContainer">
    <div class="header-bar">
      <div class="brand">
        <h1>MSTR EXTREME DEMONS <span class="tag">GD TRACKER</span></h1>
      </div>
      <div class="header-right">
        <div class="aredl-badge" id="aredlStatus">
          <span class="status-dot" id="statusDot"></span>
          <span id="aredlStatusText">CONNECTING...</span>
        </div>
        <div class="mstr-cube" id="headerCube" title="mstr.">mstr.</div>
      </div>
    </div>

    <!-- Statistiques rapides -->
    <div class="stats-strip" id="statsStrip"></div>

    <!-- Onglets -->
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-completed" onclick="switchTab('completed')">
        COMPLETED (<span id="count-completed">0</span>)
      </button>
      <button class="tab-btn" id="tab-hardest" onclick="switchTab('hardest')">
        HARDEST RANKING (<span id="count-hardest">0</span>)
      </button>
      <button class="tab-btn" id="tab-wanted" onclick="switchTab('wanted')">
        WANTED (<span id="count-wanted">0</span>)
      </button>
    </div>

    <!-- Barre de recherche et filtres secondaires -->
    <div class="toolbar">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search an Extreme Demon, notes, date..."
        oninput="renderList()"
      />
      <div class="filter-group" id="subFilters"></div>
    </div>

    <!-- Liste des niveaux -->
    <div class="demon-list" id="demonList"></div>
  </div>

  <!-- Chargement externe des données -->
  <script src="data.js"></script>

  <script>
    const BANNER_PALETTES = [
      "linear-gradient(125deg, #000000 0%, #18181b 55%, #3f3f46 100%)",
      "linear-gradient(125deg, #000000 0%, #111827 55%, #374151 100%)",
      "linear-gradient(125deg, #050505 0%, #1f1f23 50%, #52525b 100%)",
      "linear-gradient(125deg, #000000 0%, #262626 55%, #404040 100%)",
      "linear-gradient(125deg, #030303 0%, #171717 50%, #4b5563 100%)"
    ];

    const DEFAULT_SVG_FAVICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='2' y='2' width='60' height='60' rx='10' fill='%23ffffff' stroke='%23000000' stroke-width='5'/><rect x='5' y='5' width='54' height='54' rx='7' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%23000000'>mstr.</text></svg>";

    let currentTab = "completed";
    let completedSort = "recent";
    let hardestFilterOnly = false;
    let wantedCategory = "all";

    function applyCubeIcon() {
      const headerCube = document.getElementById("headerCube");
      const animatedCube = document.getElementById("animatedCube");
      const favEl = document.getElementById("pageFavicon");
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.cubeIcon && APP_CONFIG.cubeIcon.trim() !== "") {
        headerCube.innerHTML = `<img src="${APP_CONFIG.cubeIcon}" alt="cube" />`;
        animatedCube.innerHTML = `<img src="${APP_CONFIG.cubeIcon}" alt="cube" />`;
        favEl.href = APP_CONFIG.cubeIcon;
      } else {
        headerCube.textContent = "mstr.";
        animatedCube.textContent = "mstr.";
        favEl.href = DEFAULT_SVG_FAVICON;
      }
    }

    // Récupération automatique des données AREDL en direct
    async function fetchAredlData() {
      try {
        const res = await fetch("https://api.aredl.net/v2/api/aredl/levels", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP status " + res.status);
        const levels = await res.json();
        const rankMap = new Map();

        levels.forEach(lvl => {
          if (lvl.name && lvl.position) {
            const cleanName = lvl.name.toLowerCase().trim();
            if (!rankMap.has(cleanName)) {
              rankMap.set(cleanName, lvl.position);
            }
          }
        });

        let updatedCount = 0;
        ["completed", "wanted"].forEach(listKey => {
          if (APP_DATA && APP_DATA[listKey]) {
            APP_DATA[listKey].forEach(item => {
              const key = item.level.toLowerCase().trim();
              if (rankMap.has(key)) {
                const newPos = rankMap.get(key);
                if (item.top !== newPos) {
                  item.top = newPos;
                  updatedCount++;
                }
              }
            });
          }
        });
        return { success: true, count: updatedCount };
      } catch (err) {
        console.warn("AREDL API offline or unreachable, using local data:", err);
        return { success: false, error: err };
      }
    }

    function computePoints(top) {
      if (!top || top > 2000) return "0.0";
      const pts = 500 * Math.exp(-0.0052 * top);
      return Math.max(1.5, pts).toFixed(1);
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function getBannerStyle(item) {
