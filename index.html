<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mstr GD Tracker</title>
  <link id="pageFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='2' y='2' width='60' height='60' rx='10' fill='%23ffffff' stroke='%23000000' stroke-width='5'/><rect x='5' y='5' width='54' height='54' rx='7' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%23000000'>mstr.</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000;
      --bg-panel: #080808;
      --bg-panel-border: #262626;
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.16);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --card-radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 60px;
      overflow-x: hidden;
    }

    /* Écran de chargement d'introduction */
    #introLoader {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      overflow: hidden;
      transition: background-color 0.5s ease;
    }

    .intro-cube-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #animatedCube {
      width: 78px;
      height: 78px;
      background: #ffffff;
      border: 5px solid #000000;
      outline: 3px solid #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.75), 0 0 70px rgba(255, 255, 255, 0.35);
      user-select: none;
      animation: cubePulse 1.8s infinite ease-in-out;
      overflow: hidden;
      will-change: transform, opacity, box-shadow;
    }

    #animatedCube img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes cubePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.65), 0 0 60px rgba(255, 255, 255, 0.25);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 50px rgba(255, 255, 255, 0.95), 0 0 90px rgba(255, 255, 255, 0.5);
      }
    }

    .loader-info {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    .loader-text {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9ca3af;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .loader-bar-track {
      width: 180px;
      height: 3px;
      background: #18181b;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      width: 100%;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff;
      animation: loaderProgress 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loaderProgress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(100%); }
    }

    /* Conteneur principal */
    .container {
      max-width: 980px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .container.visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
      pointer-events: auto !important;
    }

    /* En-tête : Cube à gauche, titre au milieu, statut AREDL à droite */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mstr-cube {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 3.5px solid #000000;
      outline: 2px solid #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.65);
      user-select: none;
      flex-shrink: 0;
      overflow: hidden;
      opacity: 0;
    }

    .mstr-cube img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .aredl-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0a0a0a;
      border: 1px solid #27272a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e4e4e7;
      text-transform: uppercase;
      user-select: none;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 8px #eab308;
      transition: background 0.3s, box-shadow 0.3s;
    }

    /* Statistiques rapides */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.03);
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .neon-text {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
    }

    /* Onglets */
    .tabs-nav {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #222222;
      margin-bottom: 18px;
      user-select: none;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 14px 12px;
      cursor: pointer;
      position: relative;
      transition: color 0.2s, text-shadow 0.2s;
      text-transform: uppercase;
    }

    .tab-btn:hover {
      color: #d1d5db;
    }

    .tab-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.65);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 10%;
      width: 80%;
      height: 3px;
      background: #ffffff;
      box-shadow: 0 -2px 12px #ffffff, 0 0 8px #ffffff;
      border-radius: 3px 3px 0 0;
    }

    /* Barre de recherche et filtres */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: #080808;
      border: 1px solid #262626;
      color: #9ca3af;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      border-color: #52525b;
      color: #f4f4f5;
    }

    .chip-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .category-select {
      background: #080808;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .category-select option {
      background: #080808;
      color: #ffffff;
    }

    .wanted-cat-header {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      margin: 14px 0 6px;
      padding-left: 8px;
      border-left: 3px solid #ffffff;
      animation: tabEntrance 0.3s ease forwards;
    }

    /* Animation d'entrée des cartes lors du changement d'onglet */
    @keyframes cardStaggerEntrance {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .demon-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .demon-card {
      position: relative;
      min-height: 104px;
      border-radius: var(--card-radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      background-size: cover;
      background-position: center 38%;
      background-repeat: no-repeat;
      gap: 16px;
      animation: cardStaggerEntrance 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--delay, 0) * 0.028s);
    }

    .demon-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .demon-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(8, 8, 8, 0.82) 48%,
        rgba(12, 12, 12, 0.58) 100%
      );
      z-index: 1;
    }

    .card-left {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
      min-width: 0;
    }

    .rank-block {
      min-width: 84px;
      text-align: left;
    }

    .rank-number {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      line-height: 1.1;
    }

    .rank-sub {
      font-size: 0.74rem;
      color: #d4d4d8;
      font-weight: 700;
    }

    .level-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .level-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .level-name {
      font-size: 1.32rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-hardest {
      background: #ffffff;
      color: #000000;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    .badge-enjoyment {
      font-size: 0.73rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .level-meta {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e4e4e7;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .level-notes {
      font-size: 0.8rem;
      color: #a1a1aa;
      font-style: italic;
      margin-top: 2px;
    }

    .card-right {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .stat-boxes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 165px;
    }

    .stat-box {
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
    }

    @keyframes flashLastClick {
      0%, 100% {
        background: #000000;
        border-color: #7f1d1d;
        box-shadow: 0 0 6px rgba(153, 27, 27, 0.5);
      }
      50% {
        background: #630606;
        border-color: #ef4444;
        box-shadow: 0 0 16px rgba(220, 38, 38, 0.9), inset 0 0 8px rgba(220, 38, 38, 0.45);
      }
    }

    .stat-box.last-click-flash {
      animation: flashLastClick 1.15s infinite ease-in-out !important;
    }

    .stat-box .box-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .stat-box .box-val {
      font-size: 0.84rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-btn {
      width: 44px;
      height: 60px;
      background: #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      border: none;
      cursor: pointer;
    }

    .yt-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
    }

    .yt-btn svg {
      width: 20px;
      height: 20px;
      fill: #000000;
    }

    @media (max-width: 720px) {
      .header-bar {
        flex-direction: row;
        justify-content: space-between;
      }
      .demon-card {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
      }
      .card-right {
        justify-content: space-between;
        width: 100%;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 10px;
      }
      .stat-boxes {
        flex-direction: row;
        width: auto;
        flex: 1;
      }
      .stat-box {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Écran de chargement d'introduction -->
  <div id="introLoader">
    <div class="intro-cube-container">
      <div id="animatedCube" title="mstr.">mstr.</div>
    </div>
    <div class="loader-info" id="loaderInfo">
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
      <div class="loader-text" id="loaderText">CONNECTING TO AREDL API...</div>
    </div>
  </div>

  <!-- Conteneur principal du tracker -->
  <div class="container" id="mainContainer">
    <div class="header-bar">
      <div class="brand">
        <!-- Cube replacé à gauche du titre -->
        <div class="mstr-cube" id="headerCube" title="mstr.">mstr.</div>
        <h1>MSTR GD TRACKER</h1>
      </div>
      <div class="header-right">
        <div class="aredl-badge" id="aredlStatus">
          <span class="status-dot" id="statusDot"></span>
          <span id="aredlStatusText">CONNECTING...</span>
        </div>
      </div>
    </div>

    <!-- Statistiques -->
    <div class="stats-strip" id="statsStrip"></div>

    <!-- Onglets -->
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-completed" onclick="switchTab('completed')">
        COMPLETED (<span id="count-completed">0</span>)
      </button>
      <button class="tab-btn" id="tab-hardest" onclick="switchTab('hardest')">
        HARDEST RANKING (<span id="count-hardest">0</span>)
      </button>
      <button class="tab-btn" id="tab-wanted" onclick="switchTab('wanted')">
        WANTED (<span id="count-wanted">0</span>)
      </button>
    </div>

    <!-- Recherche et filtres -->
    <div class="toolbar">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search an Extreme Demon, notes, date..."
        oninput="renderList()"
      />
      <div class="filter-group" id="subFilters"></div>
    </div>

    <!-- Liste des niveaux -->
    <div class="demon-list" id="demonList"></div>
  </div>

        { order: 17, level: "BROOKLYNBLOODPOP", date: "03/07/2026", enjoyment: 100, worstFail: "59%", attempts: "2234", hardest: "Non", top: 1325, notes: "génial" },
        { order: 18, level: "Cold Sweat", date: "09/07/2026", enjoyment: 70, worstFail: "75%", attempts: "12435", hardest: "Oui", top: 160, notes: "rng demon" },
        { order: 19, level: "UNLEASH WHALES WHALE", date: "24/08/2026", enjoyment: 85, worstFail: "64%", attempts: "3048", hardest: "Non", top: 1400, notes: "HARDEST MOBILE" },
        { order: 20, level: "Sigma Interface", date: "27/08/2026", enjoyment: 93, worstFail: "89%", attempts: "2090", hardest: "Non", top: 980, notes: "peak demon" },
        { order: 21, level: "Bang Gang", date: "27/08/2026", enjoyment: 90, worstFail: "66%", attempts: "2840", hardest: "Non", top: 1562, notes: "beat 2 player" }
      ],
      wanted: [
        { order: 1, level: "Omicron", top: 433, notes: "Wanted" },
        { order: 2, level: "Xronier", top: 434, notes: "Wanted" },
        { order: 3, level: "Falling up", top: 1242, notes: "Wanted" },
        { order: 4, level: "Dark odyssey", top: 1288, notes: "Wanted" },
        { order: 5, level: "Gangnam Style", top: 1338, notes: "Wanted" },
        { order: 6, level: "Acu", top: 1406, notes: "Wanted" },
        { order: 7, level: "Red World", top: 1410, notes: "Wanted" },
        { order: 8, level: "CICADA3302", top: 1250, notes: "Wanted" }
      ]
    };

    const DATA = (typeof APP_DATA !== 'undefined' && APP_DATA.completed && APP_DATA.completed.length > 0)
      ? APP_DATA
      : EMBEDDED_DEFAULT_DATA;

    const CONFIG = (typeof APP_CONFIG !== 'undefined')
      ? APP_CONFIG
      : { attGreen: 1000, attRed: 15000, wfGreen: 50, wfRed: 95, cubeIcon: "" };

    const BANNER_PALETTES = [
      "linear-gradient(125deg, #000000 0%, #18181b 55%, #3f3f46 100%)",
      "linear-gradient(125deg, #000000 0%, #111827 55%, #374151 100%)",
      "linear-gradient(125deg, #050505 0%, #1f1f23 50%, #52525b 100%)",
      "linear-gradient(125deg, #000000 0%, #262626 55%, #404040 100%)",
      "linear-gradient(125deg, #030303 0%, #171717 50%, #4b5563 100%)"
    ];

    const DEFAULT_SVG_FAVICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='2' y='2' width='60' height='60' rx='10' fill='%23ffffff' stroke='%23000000' stroke-width='5'/><rect x='5' y='5' width='54' height='54' rx='7' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%23000000'>mstr.</text></svg>";

    let currentTab = "completed";
    let completedSort = "recent";
    let hardestFilterOnly = false;
    let wantedCategory = "all";
    let animationTriggered = false;

    // Timeout de sécurité garanti à 3 secondes
    const hardFallbackTimer = setTimeout(() => {
      if (!animationTriggered) {
        setAredlBadgeStatus(false);
        safeRender();
        triggerIntroAnimation();
      }
    }, 3000);

    function setAredlBadgeStatus(isLive) {
      const statusText = document.getElementById("aredlStatusText");
      const statusDot = document.getElementById("statusDot");
      if (statusText && statusDot) {
        if (isLive) {
          statusText.textContent = "AREDL LIVE";
          statusDot.style.background = "#22c55e";
          statusDot.style.boxShadow = "0 0 8px #22c55e";
        } else {
          statusText.textContent = "AREDL CACHED";
          statusDot.style.background = "#eab308";
          statusDot.style.boxShadow = "0 0 8px #eab308";
        }
      }
    }

    function applyCubeIcon() {
      const headerCube = document.getElementById("headerCube");
      const animatedCube = document.getElementById("animatedCube");
      const favEl = document.getElementById("pageFavicon");
      if (CONFIG.cubeIcon && CONFIG.cubeIcon.trim() !== "") {
        if (headerCube) headerCube.innerHTML = `<img src="${CONFIG.cubeIcon}" alt="cube" />`;
        if (animatedCube) animatedCube.innerHTML = `<img src="${CONFIG.cubeIcon}" alt="cube" />`;
        if (favEl) favEl.href = CONFIG.cubeIcon;
      } else {
        if (headerCube) headerCube.textContent = "mstr.";
        if (animatedCube) animatedCube.textContent = "mstr.";
        if (favEl) favEl.href = DEFAULT_SVG_FAVICON;
      }
    }

    async function fetchAredlData(timeoutMs = 2200) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch("https://api.aredl.net/v2/api/aredl/levels", {
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        clearTimeout(timer);

        if (!res.ok) throw new Error("HTTP status " + res.status);
        const levels = await res.json();
        const rankMap = new Map();

        levels.forEach(lvl => {
          if (lvl.name && lvl.position) {
            const cleanName = lvl.name.toLowerCase().trim();
            if (!rankMap.has(cleanName)) {
              rankMap.set(cleanName, lvl.position);
            }
          }
        });

        let updatedCount = 0;
        ["completed", "wanted"].forEach(listKey => {
          if (DATA[listKey]) {
            DATA[listKey].forEach(item => {
              const key = item.level.toLowerCase().trim();
              if (rankMap.has(key)) {
                const newPos = rankMap.get(key);
                if (item.top !== newPos) {
                  item.top = newPos;
                  updatedCount++;
                }
              }
            });
          }
        });
        return { success: true, count: updatedCount };
      } catch (err) {
        clearTimeout(timer);
        return { success: false, reason: err.name === 'AbortError' ? 'timeout' : 'network_error' };
      }
    }

    function computePoints(top) {
      if (!top || top > 2000) return "0.0";
      const pts = 500 * Math.exp(-0.0052 * top);
      return Math.max(1.5, pts).toFixed(1);
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function getBannerStyle(item) {
      if (item.banner && item.banner.trim() !== "") {
        return `background-image: url('${item.banner}')`;
      }
      const videoId = extractYouTubeId(item.yt);
      if (videoId) {
        return `background-image: url('https://img.youtube.com/vi/${videoId}/maxresdefault.jpg'), url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg')`;
      }
      const hash = item.level.split("").reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const gradient = BANNER_PALETTES[hash % BANNER_PALETTES.length];
      return `background-image: ${gradient}`;
    }

    function parseAttempts(att) {
      if (!att) return 0;
      const str = String(att).replace(/,/g, "").trim();
      if (str.includes("-")) {
        const parts = str.split("-").map(Number);
        return Math.round((parts[0] + parts[1]) / 2);
      }
      return parseInt(str, 10) || 0;
    }

    function formatWorstFail(wf) {
      if (!wf) return "-";
      let str = String(wf).trim();
      if (str.includes("*")) {
        str = str.replace(/\*/g, "").trim();
        if (!str.toLowerCase().includes("last click")) {
          str += " (last click)";
        }
      }
      return str;
    }

    function isLastClickFail(wf) {
      if (!wf) return false;
      const str = String(wf).toLowerCase();
      return str.includes("*") || str.includes("last click");
    }

    function parseWorstFail(wf) {
      if (!wf) return 0;
      const match = String(wf).match(/(\d+(?:\.\d+)?)/);
      return match ? parseFloat(match[1]) : 0;
    }

    function getThresholdColor(value, greenVal, redVal) {
      let ratio = 0;
      if (redVal !== greenVal) {
        ratio = (value - greenVal) / (redVal - greenVal);
      }
      ratio = Math.max(0, Math.min(1, ratio));
      const hue = Math.round((1 - ratio) * 135);
      return `background: linear-gradient(135deg, hsla(${hue}, 80%, 32%, 0.92), hsla(${hue}, 85%, 22%, 0.95)); border-color: hsla(${hue}, 85%, 52%, 0.65);`;
    }

    function getEnjoymentStyle(enjoyment) {
      const val = Math.max(0, Math.min(100, Number(enjoyment) || 0));
      const hue = Math.round((val / 100) * 135);
      return `background: hsla(${hue}, 82%, 36%, 0.95); border: 1px solid hsla(${hue}, 90%, 55%, 0.8);`;
    }

    function updateStats() {
      const comp = DATA.completed || [];
      const wanted = DATA.wanted || [];

      const countCompEl = document.getElementById("count-completed");
      const countHardEl = document.getElementById("count-hardest");
      const countWantEl = document.getElementById("count-wanted");
      if (countCompEl) countCompEl.textContent = comp.length;
      if (countHardEl) countHardEl.textContent = comp.length;
      if (countWantEl) countWantEl.textContent = wanted.length;

      const hardestLevel = [...comp].sort((a, b) => a.top - b.top)[0];
      const totalAtt = comp.reduce((sum, d) => sum + parseAttempts(d.attempts), 0);
      const avgEnjoyment = comp.length
        ? (comp.reduce((sum, d) => sum + (Number(d.enjoyment) || 0), 0) / comp.length).toFixed(1)
        : 0;

      const stripEl = document.getElementById("statsStrip");
      if (stripEl) {
        stripEl.innerHTML = `
          <div class="stat-card">
            <div class="label">Completed Extremes</div>
            <div class="value">${comp.length}</div>
          </div>
          <div class="stat-card">
            <div class="label">Current Hardest</div>
            <div class="value neon-text">${hardestLevel ? hardestLevel.level + " (#" + hardestLevel.top + ")" : "-"}</div>
          </div>
          <div class="stat-card">
            <div class="label">Total Attempts</div>
            <div class="value">${totalAtt.toLocaleString('en-US')}</div>
          </div>
          <div class="stat-card">
            <div class="label">Average Enjoyment</div>
            <div class="value">${avgEnjoyment} / 100</div>
          </div>
        `;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      const targetTab = document.getElementById(`tab-${tab}`);
      if (targetTab) targetTab.classList.add("active");
      renderSubFilters();
      renderList();
    }

    function renderSubFilters() {
      const container = document.getElementById("subFilters");
      if (!container) return;
      const totalComp = DATA.completed ? DATA.completed.length : 0;
      if (currentTab === "completed") {
        container.innerHTML = `
          <button class="chip-btn ${completedSort === 'recent' ? 'active' : ''}" onclick="setCompletedSort('recent')">Most Recent (#${totalComp} → #1)</button>
          <button class="chip-btn ${completedSort === 'chrono' ? 'active' : ''}" onclick="setCompletedSort('chrono')">Chronological (#1 → #${totalComp})</button>
          <button class="chip-btn ${completedSort === 'enjoyment' ? 'active' : ''}" onclick="setCompletedSort('enjoyment')">Highest Enjoyment</button>
        `;
      } else if (currentTab === "hardest") {
        container.innerHTML = `
          <button class="chip-btn ${!hardestFilterOnly ? 'active' : ''}" onclick="toggleHardestOnly(false)">Ranked by Difficulty (Top)</button>
          <button class="chip-btn ${hardestFilterOnly ? 'active' : ''}" onclick="toggleHardestOnly(true)">New Hardests Only</button>
        `;
      } else if (currentTab === "wanted") {
        container.innerHTML = `
          <select class="category-select" onchange="setWantedCategory(this.value)">
            <option value="all" ${wantedCategory === 'all' ? 'selected' : ''}>📂 Category: All Categories</option>
            <option value="1-150" ${wantedCategory === '1-150' ? 'selected' : ''}>🔥 Top 1 to 150</option>
            <option value="150-400" ${wantedCategory === '150-400' ? 'selected' : ''}>⚡ Top 150 to 400</option>
            <option value="400-800" ${wantedCategory === '400-800' ? 'selected' : ''}>💎 Top 400 to 800</option>
            <option value="800-1200" ${wantedCategory === '800-1200' ? 'selected' : ''}>🌊 Top 800 to 1200</option>
            <option value="1200+" ${wantedCategory === '1200+' ? 'selected' : ''}>🌟 Top 1200+</option>
          </select>
        `;
      }
    }

    function setCompletedSort(sortType) {
      completedSort = sortType;
      renderSubFilters();
      renderList();
    }

    function toggleHardestOnly(val) {
      hardestFilterOnly = val;
      renderSubFilters();
      renderList();
    }

    function setWantedCategory(cat) {
      wantedCategory = cat;
      renderList();
    }

    function getWantedCategoryKey(top) {
      const t = Number(top) || 9999;
      if (t >= 1 && t <= 150) return "1-150";
      if (t > 150 && t <= 400) return "150-400";
      if (t > 400 && t <= 800) return "400-800";
      if (t > 800 && t <= 1200) return "800-1200";
      return "1200+";
    }

    function renderCardHTML(item, idx) {
      const points = computePoints(item.top);
      const ytLink = item.yt && item.yt.trim() !== ""
        ? item.yt
        : `https://www.youtube.com/results?search_query=${encodeURIComponent(item.level + " geometry dash extreme demon")}`;

      // Conserve la vraie position dans Hardest Ranking même si on filtre par recherche
      const mainRank = currentTab === "hardest"
        ? `#${item.hardestRank || (idx + 1)}`
        : (item.top && item.top < 9999 ? `#${item.top}` : `#-`);

      const subRank = currentTab === "hardest"
        ? `Top #${item.top}`
        : (currentTab === "completed" ? `Extreme #${item.order}` : `Wanted`);

      const isHardest = String(item.hardest).toLowerCase() === "oui";
      const numAtt = parseAttempts(item.attempts);
      const formattedWf = formatWorstFail(item.worstFail);
      const lastClick = isLastClickFail(item.worstFail);
      const numWf = parseWorstFail(formattedWf);

      const attBoxStyle = getThresholdColor(numAtt, CONFIG.attGreen, CONFIG.attRed);
      const wfBoxStyle = lastClick ? "" : getThresholdColor(numWf, CONFIG.wfGreen, CONFIG.wfRed);
      const wfFlashClass = lastClick ? "last-click-flash" : "";

      const animDelay = Math.min(idx, 15);

      return `
        <div class="demon-card" style="--delay: ${animDelay}; ${getBannerStyle(item)}">
          <div class="card-left">
            <div class="rank-block">
              <div class="rank-number">${mainRank}</div>
              <div class="rank-sub">${subRank}</div>
            </div>
            <div class="level-info">
              <div class="level-title-row">
                <span class="level-name">${item.level}</span>
                ${isHardest ? `<span class="badge-hardest">NEW HARDEST</span>` : ""}
                ${item.enjoyment !== undefined ? `<span class="badge-enjoyment" style="${getEnjoymentStyle(item.enjoyment)}">★ ${item.enjoyment}/100</span>` : ""}
              </div>
              ${currentTab !== "wanted" ? `
                <div class="level-meta">
                  <span>+${points} points</span>
                  <span>|</span>
                  <span>${item.date || "Date N/A"}</span>
                </div>
              ` : `
                <div class="level-meta">
                  <span>+${points} est. points</span>
                  <span>|</span>
                  <span>AREDL Rank: ${item.top < 9999 ? "#" + item.top : "Unranked"}</span>
                </div>
              `}
              ${item.notes ? `<div class="level-notes">"${item.notes}"</div>` : ""}
            </div>
          </div>

          <div class="card-right">
            ${currentTab !== "wanted" ? `
              <div class="stat-boxes">
                <div class="stat-box" style="${attBoxStyle}">
                  <span class="box-title">Attempts</span>
                  <span class="box-val">${item.attempts || "-"}</span>
                </div>
                <div class="stat-box ${wfFlashClass}" style="${wfBoxStyle}">
                  <span class="box-title">Worst Fail</span>
                  <span class="box-val">${formattedWf}</span>
                </div>
              </div>
            ` : ""}
            <div class="card-buttons">
              <a class="yt-btn" href="${ytLink}" target="_blank" rel="noopener" title="Watch on YouTube">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function renderList() {
      const searchEl = document.getElementById("searchInput");
      const query = searchEl ? searchEl.value.toLowerCase().trim() : "";
      const listEl = document.getElementById("demonList");
      if (!listEl) return;
      let items = [];

      const comp = DATA.completed || [];
      const wanted = DATA.wanted || [];

      if (currentTab === "completed") {
        items = [...comp];
        if (completedSort === "recent") items.sort((a, b) => b.order - a.order);
        if (completedSort === "chrono") items.sort((a, b) => a.order - b.order);
        if (completedSort === "enjoyment") items.sort((a, b) => (b.enjoyment || 0) - (a.enjoyment || 0));
      } else if (currentTab === "hardest") {
        items = [...comp];
        if (hardestFilterOnly) {
          items = items.filter(d => String(d.hardest).toLowerCase() === "oui");
        }
        // Tri officiel du Hardest
        items.sort((a, b) => (a.top || 9999) - (b.top || 9999));
        // Attribution du rang absolu AVANT le filtre de recherche
        items.forEach((item, index) => {
          item.hardestRank = index + 1;
        });
      } else if (currentTab === "wanted") {
        items = [...wanted].sort((a, b) => (a.top || 9999) - (b.top || 9999));
        if (wantedCategory !== "all") {
          items = items.filter(d => getWantedCategoryKey(d.top) === wantedCategory);
        }
      }

      // Application de la recherche textuelle
      if (query) {
        items = items.filter(d =>
          d.level.toLowerCase().includes(query) ||
          (d.notes && d.notes.toLowerCase().includes(query)) ||
          (d.date && d.date.toLowerCase().includes(query)) ||
          String(d.top).includes(query)
        );
      }

      if (items.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No Extreme Demons found.</div>`;
        return;
      }

      if (currentTab === "wanted" && wantedCategory === "all") {
        const categories = [
          { key: "1-150", label: "Top 1 to 150" },
          { key: "150-400", label: "Top 150 to 400" },
          { key: "400-800", label: "Top 400 to 800" },
          { key: "800-1200", label: "Top 800 to 1200" },
          { key: "1200+", label: "Top 1200+" }
        ];
        let html = "";
        categories.forEach(cat => {
          const group = items.filter(d => getWantedCategoryKey(d.top) === cat.key);
          if (group.length > 0) {
            html += `<div class="wanted-cat-header">${cat.label} (${group.length})</div>`;
            html += group.map((item, idx) => renderCardHTML(item, idx)).join("");
          }
        });
        listEl.innerHTML = html;
        return;
      }

      listEl.innerHTML = items.map((item, idx) => renderCardHTML(item, idx)).join("");
    }

    function safeRender() {
      try {
        updateStats();
        renderSubFilters();
        renderList();
      } catch (e) {
        console.error("[Tracker] Render error:", e);
      }
    }

    // Animation séquentielle :
    // 1. Le cube se déplace à sa place (à gauche)
    // 2. Une fois arrivé, fondu d'apparition du tracker (opacité 0 -> 1)
    function triggerIntroAnimation() {
      if (animationTriggered) return;
      animationTriggered = true;
      clearTimeout(hardFallbackTimer);

      const introLoader = document.getElementById("introLoader");
      const animatedCube = document.getElementById("animatedCube");
      const headerCube = document.getElementById("headerCube");
      const container = document.getElementById("mainContainer");
      const loaderInfo = document.getElementById("loaderInfo");

      if (loaderInfo) loaderInfo.style.opacity = "0";

      if (!animatedCube || !headerCube || !container) {
        if (introLoader) introLoader.remove();
        if (container) container.classList.add("visible");
        return;
      }

      try {
        const startRect = animatedCube.getBoundingClientRect();
        const endRect = headerCube.getBoundingClientRect();

        const deltaX = (endRect.left + endRect.width / 2) - (startRect.left + startRect.width / 2);
        const deltaY = (endRect.top + endRect.height / 2) - (startRect.top + startRect.height / 2);
        const scale = endRect.width / (startRect.width || 78);

        // Étape 1 : Déplacement du cube vers la gauche
        animatedCube.style.animation = "none";
        animatedCube.style.transition = "transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.72s ease";
        animatedCube.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${scale})`;
        animatedCube.style.boxShadow = "0 0 15px rgba(255, 255, 255, 0.65)";

        // Étape 2 : Dès que le cube a terminé sa course, le tracker apparaît en fondu
        setTimeout(() => {
          headerCube.style.opacity = "1";
          animatedCube.style.opacity = "0";

          container.classList.add("visible");
          introLoader.style.backgroundColor = "transparent";
          introLoader.style.pointerEvents = "none";

          setTimeout(() => {
            if (introLoader) introLoader.remove();
          }, 650);
        }, 730);
      } catch (err) {
        console.error("[Tracker] Animation error:", err);
        container.classList.add("visible");
        if (introLoader) introLoader.remove();
      }
    }

    async function initApp() {
      applyCubeIcon();

      const minDisplayTimer = new Promise(resolve => setTimeout(resolve, 800));
      const aredlFetchPromise = fetchAredlData(2000);

      try {
        const [_, aredlResult] = await Promise.all([minDisplayTimer, aredlFetchPromise]);
        setAredlBadgeStatus(aredlResult && aredlResult.success);
      } catch (err) {
        setAredlBadgeStatus(false);
      }

      safeRender();
      triggerIntroAnimation();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
